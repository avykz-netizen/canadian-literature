<html>
<body>
<pre id="out"></pre>
<input id="inp" size="40">
<button onclick="go()">go</button>
<button onclick="nxt()">next</button>
<script>
var S = ["S","H","D","C"];
var sym = {S:"\u2660",H:"\u2665",D:"\u2666",C:"\u2663"};
var sets = {};
var rl = ["2","3","4","5","6","7"];
var rh = ["9","10","J","Q","K","A"];
for (var i = 0; i < 4; i++) {
  var s = S[i];
  sets["low" + s] = [];
  sets["high" + s] = [];
  for (var j = 0; j < 6; j++) {
    sets["low" + s].push(rl[j] + s);
    sets["high" + s].push(rh[j] + s);
  }
}
sets.mid = ["8S","8H","8D","8C","RJ","BJ"];

var all = [];
for (var n in sets) {
  for (var j = 0; j < 6; j++) all.push(sets[n][j]);
}

var hand = [[],[],[],[],[],[]];
var mem = [{},{},{},{},{},{}];
var done = {};
var score = [0, 0];
var log = [];
var turn = 0;
var over = false;
var msg = "your turn";

function show(c) {
  if (c == "RJ" || c == "BJ") return c;
  return c.slice(0, -1) + sym[c[c.length - 1]];
}

function setOf(c) {
  for (var n in sets) {
    if (sets[n].indexOf(c) >= 0) return n;
  }
}

function srt(a, b) {
  return all.indexOf(a) - all.indexOf(b);
}

function deal() {
  var d = all.slice();
  for (var i = d.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = d[i];
    d[i] = d[j];
    d[j] = t;
  }
  for (var i = 0; i < 54; i++) hand[i % 6].push(d[i]);
  for (var i = 0; i < 6; i++) hand[i].sort(srt);
}

function fix() {
  var c = [0, 0];
  for (var i = 0; i < 6; i++) c[i % 2] += hand[i].length;
  for (var t = 0; t < 2; t++) {
    if (c[t] == 0 && c[1 - t] > 0) {
      for (var n in sets) {
        if (done[n] == undefined) {
          done[n] = 1 - t;
          score[1 - t]++;
          log.push(n + " goes to team " + (1 - t) + " because the other team is out of cards");
        }
      }
    }
  }
  if (score[0] >= 5 || score[1] >= 5) over = true;
  if (!over && hand[turn].length == 0) {
    for (var i = 0; i < 6; i++) {
      if (i % 2 == turn % 2 && hand[i].length > 0) {
        log.push("player " + turn + " has no cards and passes to player " + i);
        turn = i;
        break;
      }
    }
  }
}

function ask(p, q, c) {
  var i = hand[q].indexOf(c);
  var yes = i >= 0;
  if (yes) {
    hand[q].splice(i, 1);
    hand[p].push(c);
    hand[p].sort(srt);
    log.push("player " + p + " asks player " + q + " for " + show(c) + ": yes");
  } else {
    log.push("player " + p + " asks player " + q + " for " + show(c) + ": no");
    turn = q;
  }
  for (var b = 1; b < 6; b++) {
    if (Math.random() < 0.5) {
      if (yes) mem[b][c] = p;
      else if (mem[b][c] == q) delete mem[b][c];
    }
  }
  fix();
}

function dec(p, n, a) {
  var ok = true;
  for (var i = 0; i < 6; i++) {
    var c = sets[n][i];
    if (a[i] % 2 != p % 2 || hand[a[i]] == undefined || hand[a[i]].indexOf(c) < 0) ok = false;
  }
  var w = ok ? p % 2 : 1 - p % 2;
  done[n] = w;
  score[w]++;
  for (var j = 0; j < 6; j++) {
    hand[j] = hand[j].filter(function (x) { return sets[n].indexOf(x) < 0; });
  }
  log.push("player " + p + " declares " + n + ": " + (ok ? "right" : "wrong") + ", team " + w + " gets it");
  fix();
}

function bot(b) {
  var opts = [];
  var good = [];
  for (var n in sets) {
    if (done[n] != undefined) continue;
    var has = sets[n].filter(function (c) { return hand[b].indexOf(c) >= 0; });
    if (has.length == 6) {
      dec(b, n, [b, b, b, b, b, b]);
      return;
    }
    if (has.length == 0) continue;
    for (var j = 0; j < 6; j++) {
      var c = sets[n][j];
      if (hand[b].indexOf(c) >= 0) continue;
      for (var q = 0; q < 6; q++) {
        if (q % 2 == b % 2 || hand[q].length == 0) continue;
        opts.push([q, c]);
        if (mem[b][c] == q) good.push([q, c]);
      }
    }
  }
  if (opts.length == 0) return;
  var pick;
  if (good.length > 0 && Math.random() < 0.7) {
    pick = good[Math.floor(Math.random() * good.length)];
  } else {
    pick = opts[Math.floor(Math.random() * opts.length)];
  }
  ask(b, pick[0], pick[1]);
}

function go() {
  if (over) return;
  var box = document.getElementById("inp");
  var w = box.value.trim().toLowerCase().split(/\s+/);
  box.value = "";
  if (w[0] == "d") {
    var n = "";
    for (var k in sets) {
      if (k.toLowerCase() == w[1]) n = k;
    }
    var a = w.slice(2).map(Number);
    if (n == "" || a.length != 6) msg = "bad declare";
    else if (done[n] != undefined) msg = "that set is already done";
    else dec(0, n, a);
    draw();
    return;
  }
  var q = parseInt(w[0]);
  var c = (w[1] || "").toUpperCase();
  var n = setOf(c);
  if (turn != 0) msg = "not your turn";
  else if (n == undefined) msg = "bad card";
  else if (!(q % 2 == 1) || q > 5) msg = "pick a player from the other team (1 3 or 5)";
  else if (hand[q].length == 0) msg = "that player has no cards";
  else if (hand[0].indexOf(c) >= 0) msg = "you already have that card";
  else if (!hand[0].some(function (x) { return setOf(x) == n; })) msg = "you need a card from that set";
  else ask(0, q, c);
  draw();
}

function nxt() {
  if (over) return;
  if (turn == 0) {
    msg = "its your turn, type your ask";
    draw();
    return;
  }
  bot(turn);
  draw();
}

function draw() {
  var o = msg + "\n\n";
  msg = "";
  o += "you are player 0, your teammates are 2 and 4\n";
  o += "score: your team " + score[0] + ", other team " + score[1] + "\n\n";
  o += "your cards: " + hand[0].map(show).join(" ") + "\n\n";
  o += "cards left: ";
  for (var i = 0; i < 6; i++) o += "p" + i + "=" + hand[i].length + " ";
  o += "\n\n";
  if (over) {
    o += "game over, " + (score[0] > score[1] ? "you win" : "you lose") + " " + score[0] + " to " + score[1] + "\n\n";
  } else if (turn == 0) {
    o += "its your turn\n\n";
  } else {
    o += "its player " + turn + "s turn, click next\n\n";
  }
  o += "sets:\n";
  for (var n in sets) {
    o += n + ": " + sets[n].map(show).join(" ");
    if (done[n] != undefined) o += "  (done, team " + done[n] + ")";
    o += "\n";
  }
  o += "\nto ask type the player number and the card like  1 7S\n";
  o += "cards are 2-10 J Q K A then S H D C, jokers are RJ and BJ\n";
  o += "to declare type d, the set, then the 6 players in card order like  d lowS 0 0 2 2 4 0\n\n";
  o += log.slice(-12).join("\n");
  document.getElementById("out").textContent = o;
}

deal();
draw();
</script>
</body>
</html>
